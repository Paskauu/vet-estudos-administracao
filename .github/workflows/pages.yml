name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Conferir e preparar o site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Validar conteúdo e compilar para o endereço do projeto
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Preparar arquivos de publicação
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar o site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
