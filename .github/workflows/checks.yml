name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Validar conteúdo e compilar
        run: npm run build
